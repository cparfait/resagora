# Application mobile des gardiens (PWA) : servie sur le LAN, joignable par le VPN (option A, SEC-10).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/conf.d/commun.inc;

    location = /sante { access_log off; return 200 "ok"; }
    # Le service worker ne doit jamais être mis en cache par le navigateur : mise à jour au retour du réseau.
    location = /sw.js { add_header Cache-Control "no-cache" always; include /etc/nginx/conf.d/commun.inc; }
    location = /manifest.webmanifest { default_type application/manifest+json; include /etc/nginx/conf.d/commun.inc; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable" always; include /etc/nginx/conf.d/commun.inc; }
    location / { try_files $uri $uri/ /index.html; }
}
