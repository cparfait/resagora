# Zone LAN : API métier, base, tâches, back-office, application mobile (option A), services internes.
# Seul flux entrant depuis la DMZ : api-portail sur 8443 en mTLS (SEC-01).
# Base : le rôle « equipements » (propriétaire) ne sert qu'aux migrations et à la maintenance ;
# les services applicatifs utilisent « equipements_app », sans privilège d'administration (ADR 0005).
name: equipements-lan

x-journaux: &journaux
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "20" }

x-durci: &durci
  <<: *journaux
  read_only: true
  tmpfs: [/tmp]
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 1g
  cpus: 1.0
  restart: unless-stopped

x-api: &api
  <<: *durci
  image: ${REGISTRE:-equipements}/api:${VERSION:-dev}
  build: { context: ../.., dockerfile: deploy/images/api.Dockerfile }
  env_file: [parametres.env]
  environment: &env_api
    POSTGRES_USER: equipements_app
    FORWARDED_ALLOW_IPS: 10.231.20.250
  secrets: &secrets_api
    - django_secret_key
    - cle_chiffrement
    - audit_cle_hmac
    - { source: postgres_app_password, target: postgres_password }
    - valkey_url
    - ldap_mot_de_passe
    - ldap_ac.pem
    - docuseal_api_jeton
    - payfip_secret
    - smtp_mot_de_passe
    - sms_jeton
  volumes: [stockage:/stockage]
  networks: [lan_app, lan_data]
  depends_on:
    migrations: { condition: service_completed_successfully }

services:
  postgres:
    <<: *journaux
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_DB: equipements
      POSTGRES_USER: equipements
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets: [postgres_password, postgres_app_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [lan_data]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    shm_size: 256m
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U equipements"], interval: 5s, retries: 30 }

  valkey:
    image: valkey/valkey:9.1.3-trixie@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    <<: *durci
    user: "999:999"
    # Le mot de passe est écrit dans un fichier de configuration temporaire, jamais en argument de commande.
    entrypoint: ["sh", "-c", "printf 'requirepass %s\\nsave \"\"\\nappendonly no\\nenable-debug-command no\\n' \"$$(cat /run/secrets/valkey_mot_de_passe)\" > /tmp/valkey.conf && exec valkey-server /tmp/valkey.conf"]
    secrets: [valkey_mot_de_passe]
    networks: [lan_data]

  migrations:
    <<: *durci
    image: ${REGISTRE:-equipements}/api:${VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/images/api.Dockerfile }
    env_file: [parametres.env]
    environment: { POSTGRES_USER: equipements }
    secrets: [django_secret_key, cle_chiffrement, audit_cle_hmac, postgres_password, valkey_url, payfip_secret]
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py accorder_droits equipements_app && python manage.py verifier_deploiement"]
    restart: "no"
    # Les migrations de données écrivent les modèles de documents livrés (DOC-02) dans le stockage.
    volumes: [stockage:/stockage]
    networks: [lan_data]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *api
    environment: { <<: *env_api, CANAL: gestion }
    networks:
      lan_app: {}
      lan_data: {}

  api-portail:
    <<: *api
    environment: { <<: *env_api, CANAL: portail }
    secrets:
      - django_secret_key
      - cle_chiffrement
      - audit_cle_hmac
      - { source: postgres_app_password, target: postgres_password }
      - valkey_url
      - api_portail.crt
      - api_portail.key
      - ac_facade.crt
      # Vérification de la signature des notifications PayFiP (TAR-07) ; api-portail ne joint pas PayFiP (ADR 0008).
      - payfip_secret
    # Moindre privilège : api-portail ne joint ni DocuSeal, ni le serveur de messagerie, ni PayFiP (D-030, ADR 0008).
    command: ["gunicorn", "config.wsgi", "--bind", "0.0.0.0:8443", "--control-socket", "/tmp/gunicorn.ctl", "--workers", "3",
              "--timeout", "60", "--certfile", "/run/secrets/api_portail.crt", "--keyfile", "/run/secrets/api_portail.key",
              "--ca-certs", "/run/secrets/ac_facade.crt", "--cert-reqs", "2"]
    healthcheck: { test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8443),3)"], interval: 30s }
    ports: ["${IP_LIAISON_DMZ:-127.0.0.1}:8443:8443"]
    networks: [lan_data, liaison_dmz]

  worker:
    <<: *api
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "celery,documents,notifications"]
    healthcheck: { test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "5"], interval: 60s }
    networks: [lan_app, lan_data, sortie_lan]

  beat:
    <<: *api
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }

  backoffice:
    <<: *durci
    user: "101:101"
    image: ${REGISTRE:-equipements}/backoffice:${VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/images/front.Dockerfile, args: { APPLICATION: backoffice } }
    tmpfs: [/tmp, /var/cache/nginx]
    networks: [lan_app]

  mobile:
    <<: *durci
    user: "101:101"
    image: ${REGISTRE:-equipements}/mobile:${VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/images/front.Dockerfile, args: { APPLICATION: mobile } }
    tmpfs: [/tmp, /var/cache/nginx]
    networks: [lan_app]

  proxy-lan:
    image: traefik:v3.7.17@sha256:30ff62491aacdb862ceb8c9edcf2627da638d7deafdd4b6dab32fe34f8aa3e90
    <<: *durci
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes: ["./traefik:/etc/traefik:ro"]
    secrets: [lan_tls.crt, lan_tls.key]
    ports: ["${IP_LAN:-127.0.0.1}:443:8443"]
    networks:
      lan_app: { ipv4_address: 10.231.20.250 }

  gotenberg:
    image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    command: ["gotenberg", "--api-timeout=120s", "--libreoffice-auto-start=true"]
    <<: *durci
    user: "1001:1001"
    mem_limit: 2g
    networks: [lan_app]

  preparer-clamav:
    # Tâche ponctuelle : le volume des signatures est attribué à l'utilisateur clamav (capacités CHOWN et lecture).
    <<: *journaux
    image: clamav/clamav:1.5.4-debian13-slim@sha256:cce3e1a43ae2bb40e11335c52c0e1e98273b12fa3d587e617f63a6907cc4b70b
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/var/lib/clamav"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    network_mode: none
    volumes: [clamav-lan:/var/lib/clamav]
    restart: "no"

  clamav:
    <<: *durci
    image: clamav/clamav:1.5.4-debian13-slim@sha256:cce3e1a43ae2bb40e11335c52c0e1e98273b12fa3d587e617f63a6907cc4b70b
    # Sans root ni capacité, système de fichiers en lecture seule (revue sécurité du lot 2, M11).
    user: "1000:1000"
    entrypoint: ["sh", "/etc/clamav-ville/demarrer.sh"]
    healthcheck: { test: ["CMD-SHELL", "clamdcheck.sh"], interval: 60s, start_period: 360s }
    mem_limit: 3g
    pids_limit: 128
    volumes: [clamav-lan:/var/lib/clamav, ../clamav:/etc/clamav-ville:ro]
    # lan_app pour l'analyse, sortie_lan pour les mises à jour des signatures (freshclam) par le proxy de la Ville.
    networks: [lan_app, sortie_lan]
    depends_on: { preparer-clamav: { condition: service_completed_successfully } }

networks:
  lan_app:
    ipam: { config: [{ subnet: 10.231.20.0/24 }] }
  lan_data: { internal: true }
  liaison_dmz: {}
  sortie_lan: {}

volumes:
  pgdata:
  stockage:
  clamav-lan:

secrets:
  django_secret_key: { file: ./secrets/django_secret_key }
  cle_chiffrement: { file: ./secrets/cle_chiffrement }
  audit_cle_hmac: { file: ./secrets/audit_cle_hmac }
  postgres_password: { file: ./secrets/postgres_password }
  postgres_app_password: { file: ./secrets/postgres_app_password }
  valkey_url: { file: ./secrets/valkey_url }
  valkey_mot_de_passe: { file: ./secrets/valkey_mot_de_passe }
  ldap_mot_de_passe: { file: ./secrets/ldap_mot_de_passe }
  ldap_ac.pem: { file: ./secrets/ac_interne.crt }
  docuseal_api_jeton: { file: ./secrets/docuseal_api_jeton }
  payfip_secret: { file: ./secrets/payfip_secret }
  smtp_mot_de_passe: { file: ./secrets/smtp_mot_de_passe }
  sms_jeton: { file: ./secrets/sms_jeton }
  api_portail.crt: { file: ./secrets/api_portail.crt }
  api_portail.key: { file: ./secrets/api_portail.key }
  ac_facade.crt: { file: ./secrets/ac_facade.crt }
  lan_tls.crt: { file: ./secrets/lan_tls.crt }
  lan_tls.key: { file: ./secrets/lan_tls.key }
