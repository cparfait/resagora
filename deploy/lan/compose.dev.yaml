# Surcharge de développement / recette sur un seul hôte : services de test (annuaire OpenLDAP,
# Mailpit, simulateurs PayFiP/SMS/Ciril) joints par le réseau d'outillage. Jamais en production.
# L'API de gestion n'est jamais sur le réseau de liaison avec la DMZ : seule api-portail l'est.
# DocuSeal (DMZ) est joint par le réseau « liaison_signature », sans la façade.
x-simulateurs: &simulateurs
  # Seule cette valeur autorise les adresses de simulateurs et les seuils élargis (`verifier_deploiement`).
  ENVIRONNEMENT: recette
  # Recette sur un seul hôte : DocuSeal et l'opérateur SMS sont remplacés par les simulateurs (deploy/dev).
  DOCUSEAL_URL: http://simulateurs:8090
  DOCUSEAL_URL_PUBLIQUE: http://localhost:53010
  SMS_ADAPTATEUR: http
  SMS_URL: http://simulateurs:8090/sms/messages
  PORTAIL_URL: https://equipements.chatillon.test:9443
  # PayFiP (lot 7) : simulateur en mode Régie, saisie « T » (test) ; la notification repasse par la façade.
  PAYFIP_ACTIF: "1"
  PAYFIP_MODE: regie
  PAYFIP_SAISIE: T
  PAYFIP_NUMCLI: "000000"
  PAYFIP_URL_SERVICE: http://simulateurs:8090/payfip/services/securite
  PAYFIP_URL_PAIEMENT: http://localhost:53010/payfip/paiementws.web
  PAYFIP_URL_NOTIFICATION: https://equipements.chatillon.test:9443/api/portail/payfip/notification
  # Parcours automatisés répétés depuis une seule adresse : seuils élargis (valeurs par défaut en production).
  DEBIT_CONNEXION: 500/min
  DEBIT_INSCRIPTION: 250/hour
  DEBIT_REINITIALISATION: 250/hour
  DEBIT_DEPOT: 1500/hour
  DEBIT_TELEVERSEMENT: 3000/hour
  BACKOFFICE_URL: https://localhost

services:
  migrations:
    environment: { <<: *simulateurs, POSTGRES_USER: equipements }
  api:
    environment: { <<: *simulateurs, CANAL: gestion, POSTGRES_USER: equipements_app, FORWARDED_ALLOW_IPS: 10.231.20.250 }
    networks:
      lan_app: {}
      lan_data: {}
      outillage: {}
      liaison_signature: {}
  api-portail:
    environment: { <<: *simulateurs, CANAL: portail, POSTGRES_USER: equipements_app, FORWARDED_ALLOW_IPS: 10.231.20.250 }
    # Sur un hôte unique, la façade joint api-portail par le réseau de liaison : pas de port publié.
    ports: !reset []
    networks: [lan_data, liaison_dmz, outillage]
  worker:
    environment: { <<: *simulateurs, POSTGRES_USER: equipements_app, FORWARDED_ALLOW_IPS: 10.231.20.250 }
    networks: [lan_app, lan_data, sortie_lan, outillage, liaison_signature]
  beat:
    environment: { <<: *simulateurs, POSTGRES_USER: equipements_app, FORWARDED_ALLOW_IPS: 10.231.20.250 }
    networks: [lan_data, outillage]

networks:
  outillage:
    name: equipements-dev_default
    external: true
  liaison_signature:
    name: equipements-liaison-signature
