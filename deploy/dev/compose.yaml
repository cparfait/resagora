# Services de développement et de test (poste du développeur et CI).
# Ports publiés uniquement sur 127.0.0.1. Aucun service réel de la Ville.
name: equipements-dev

services:
  postgres-dev:
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_DB: equipements
      POSTGRES_USER: equipements
      POSTGRES_PASSWORD: dev-uniquement
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pg-dev:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipements"]
      interval: 5s
      retries: 20

  valkey-dev:
    image: valkey/valkey:9-trixie@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    ports: ["127.0.0.1:56379:6379"]

  annuaire:
    build:
      context: ../..
      dockerfile: deploy/dev/annuaire/Dockerfile
    ports: ["127.0.0.1:50389:1389", "127.0.0.1:50636:1636"]
    secrets: [ldap_admin_mot_de_passe, ldap_mot_de_passe, mdp_agents_demo, annuaire.crt, annuaire.key, ac_interne.crt]
    read_only: true
    tmpfs: [/tmp, "/run/slapd:uid=100,gid=101", "/var/lib/ldap:uid=100,gid=101"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:58025:8025"]

  gotenberg-dev:
    image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    ports: ["127.0.0.1:53000:3000"]

  clamav-dev:
    image: clamav/clamav:1.5.4-debian13-slim@sha256:cce3e1a43ae2bb40e11335c52c0e1e98273b12fa3d587e617f63a6907cc4b70b
    ports: ["127.0.0.1:53310:3310"]

  docuseal-dev:
    image: docuseal/docuseal:3.3.4@sha256:2786607f1f6eb54f982a926bd78c81ee23b6545e59d1ff548bd672094760621c
    ports: ["127.0.0.1:53001:3000"]
    volumes: [docuseal-dev:/data]

  simulateurs:
    # SMS (COM-05), DocuSeal (SIG-01 à SIG-04) et PayFiP (lot 7) simulés ; pages de consultation sur http://localhost:53010.
    build: { context: ../.., dockerfile: deploy/images/simulateurs.Dockerfile }
    ports: ["127.0.0.1:53010:8090"]
    environment:
      SIMULATEUR_URL_PUBLIQUE: http://localhost:53010
      SIMULATEUR_SMS_JETON_FICHIER: /run/secrets/simulateur_sms_jeton
      SIMULATEUR_DOCUSEAL_JETON_FICHIER: /run/secrets/simulateur_docuseal_api_jeton
      SIMULATEUR_DOCUSEAL_WEBHOOK_SECRET_FICHIER: /run/secrets/simulateur_docuseal_webhook_secret
      SIMULATEUR_DOCUSEAL_WEBHOOK_URL: https://equipements.chatillon.test:9443/api/portail/webhooks/docuseal
      SIMULATEUR_DOCUSEAL_WEBHOOK_ENTETE: X-Docuseal-Secret
      SIMULATEUR_VERIFIER_TLS: "0"
      SIMULATEUR_PAYFIP_NUMCLI: "000000"
    # Les webhooks passent par le proxy DMZ et la façade, comme ceux du vrai DocuSeal.
    extra_hosts: ["equipements.chatillon.test:host-gateway"]
    secrets: [simulateur_sms_jeton, simulateur_docuseal_api_jeton, simulateur_docuseal_webhook_secret]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  outils:
    # make sous Linux pour les postes Windows (D-005) : dépendances natives dans des volumes dédiés.
    profiles: [outils]
    build: { context: ../.., dockerfile: deploy/dev/outils.Dockerfile }
    working_dir: /depot
    volumes:
      - ../..:/depot
      - outils-node:/depot/node_modules
      - outils-codegen:/depot/outils/codegen/node_modules
      - outils-bo:/depot/backoffice/node_modules
      - outils-portail:/depot/portail/node_modules
      - outils-mobile:/depot/mobile/node_modules
      - outils-e2e:/depot/e2e/node_modules
      - outils-venvs:/venvs
    environment:
      BACK_VENV: /venvs/backend
      FACADE_VENV: /venvs/facade
      BACK_PY: /venvs/backend/bin/python
      FACADE_PY: /venvs/facade/bin/python
      POSTGRES_HOST: postgres-dev
      POSTGRES_PORT: "5432"
      PLAYWRIGHT_BROWSERS_PATH: /venvs/playwright

volumes:
  outils-node:
  outils-codegen:
  outils-bo:
  outils-portail:
  outils-mobile:
  outils-e2e:
  outils-venvs:
  pg-dev:
  docuseal-dev:

secrets:
  ldap_admin_mot_de_passe: { file: ./secrets/ldap_admin_mot_de_passe }
  ldap_mot_de_passe: { file: ./secrets/ldap_mot_de_passe }
  mdp_agents_demo: { file: ./secrets/mdp_agents_demo }
  annuaire.crt: { file: ./secrets/annuaire.crt }
  annuaire.key: { file: ./secrets/annuaire.key }
  ac_interne.crt: { file: ./secrets/ac_interne.crt }
  simulateur_sms_jeton: { file: ./secrets/simulateur_sms_jeton }
  simulateur_docuseal_api_jeton: { file: ./secrets/simulateur_docuseal_api_jeton }
  simulateur_docuseal_webhook_secret: { file: ./secrets/simulateur_docuseal_webhook_secret }
