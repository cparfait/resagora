# Services de développement et de test (poste du développeur et CI).
# Ports publiés uniquement sur 127.0.0.1. Aucun service réel de la Ville.
name: equipements-dev

services:
  postgres:
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_DB: equipements
      POSTGRES_USER: equipements
      POSTGRES_PASSWORD: dev-uniquement
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pg-dev:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipements"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9-trixie@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    ports: ["127.0.0.1:56379:6379"]

  annuaire:
    build:
      context: ../..
      dockerfile: deploy/dev/annuaire/Dockerfile
    ports: ["127.0.0.1:50389:389", "127.0.0.1:50636:636"]

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:58025:8025"]

  gotenberg:
    image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    ports: ["127.0.0.1:53000:3000"]

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    ports: ["127.0.0.1:53310:3310"]

  docuseal:
    image: docuseal/docuseal:3.3.4
    ports: ["127.0.0.1:53001:3000"]
    volumes: [docuseal-dev:/data]

  simulateurs:
    build:
      context: ../..
      dockerfile: deploy/dev/simulateurs/Dockerfile
    ports: ["127.0.0.1:58090:8090"]

volumes:
  pg-dev:
  docuseal-dev:
