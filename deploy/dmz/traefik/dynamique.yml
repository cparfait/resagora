# Routage DMZ (SEC-01). Le back-office et l'administration DocuSeal ne sont jamais publiés.
tls:
  certificates:
    - certFile: /run/secrets/dmz_tls.crt
      keyFile: /run/secrets/dmz_tls.key
  options:
    default:
      minVersion: VersionTLS12
    appareils:
      # Option B de l'accès mobile (SEC-10) : certificat d'appareil obligatoire.
      minVersion: VersionTLS12
      clientAuth:
        caFiles: [/run/secrets/ac_appareils.crt]
        clientAuthType: RequireAndVerifyClientCert

http:
  middlewares:
    entetes:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: same-origin
        customResponseHeaders:
          Server: ""
    debit:
      rateLimit: { average: 50, burst: 100, period: 1s }
    taille:
      buffering: { maxRequestBodyBytes: 12582912 }
    certificat-appareil:
      # Option B (SEC-10) : le certificat client vérifié (RequireAndVerifyClientCert) est transmis entier, en PEM
      # échappé (en-tête X-Forwarded-Tls-Client-Cert, réécrit par Traefik) ; l'API compare son empreinte SHA-256.
      passTLSClientCert:
        pem: true

  routers:
    portail:
      rule: "Host(`equipements.chatillon.test`)"
      service: portail
      middlewares: [entetes, debit]
      priority: 10
    facade:
      rule: "Host(`equipements.chatillon.test`) && PathPrefix(`/api/portail/`)"
      service: facade
      middlewares: [entetes, debit, taille]
      priority: 100
    agenda:
      # POR-05 : flux iCal lu par son seul jeton (dans le chemin) ; pas de journal d'accès, pour que le jeton
      # n'apparaisse dans aucun journal (D-077). Le débit est limité par la façade.
      rule: 'Host(`equipements.chatillon.test`) && PathRegexp(`^/api/portail/agenda/[A-Za-z0-9_-]{43}[.]ics$`)'
      service: facade
      middlewares: [entetes, debit, taille]
      priority: 110
      observability: { accessLogs: false }
    signature:
      # Seules les pages de signature des signataires (/s/<jeton>) et leurs ressources statiques et fichiers.
      # Exclus : /api (sauf dépôt de l'image de signature par le signataire), /d/ (liens partagés de modèles),
      # /rails/active_storage/direct_uploads (dépôt anonyme), /sign_in, /settings et toute l'administration.
      rule: >-
        Host(`signature.chatillon.test`) && (
          PathRegexp(`^/s/[A-Za-z0-9_-]{8,}(/[A-Za-z0-9_./-]*)?$`) ||
          PathRegexp(`^/(packs|assets)/[A-Za-z0-9_./-]+$`) ||
          (PathRegexp(`^/(file|blobs_proxy)/[A-Za-z0-9_./=-]+$`) && Method(`GET`)) ||
          (Path(`/api/attachments`) && Method(`POST`))
        )
      service: docuseal
      middlewares: [entetes, debit, taille]
      priority: 100
    mobile-b-api:
      rule: "Host(`gardiens.chatillon.test`) && PathPrefix(`/api/mobile/`)"
      service: facade
      middlewares: [entetes, debit, taille, certificat-appareil]
      tls: { options: appareils }
      priority: 100
    mobile-b:
      rule: "Host(`gardiens.chatillon.test`)"
      service: mobile-b
      middlewares: [entetes]
      tls: { options: appareils }
      priority: 10

  services:
    portail:
      loadBalancer: { servers: [{ url: "http://portail:8080" }] }
    facade:
      loadBalancer: { servers: [{ url: "http://facade:8080" }], healthCheck: { path: /sante, interval: 30s } }
    docuseal:
      loadBalancer: { servers: [{ url: "http://docuseal:3000" }] }
    mobile-b:
      loadBalancer: { servers: [{ url: "http://mobile-b:8080" }] }
