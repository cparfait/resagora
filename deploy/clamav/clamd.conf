# clamd sans privilège (utilisateur clamav, système de fichiers en lecture seule) : SEC-07, revue du lot 2 (M11).
# Pas de fichier de journal : au premier plan, clamd et freshclam écrivent sur la sortie du conteneur.
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
# Limites alignées sur la taille maximale des fichiers déposés (10 Mo) avec une marge pour les archives.
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxThreads 4
