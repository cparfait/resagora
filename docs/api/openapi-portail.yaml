components:
  schemas:
    BlankEnum:
      enum:
      - ''
    ChangementMotDePasseRequest:
      type: object
      properties:
        actuel:
          type: string
          minLength: 1
          maxLength: 256
        nouveau:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - actuel
      - nouveau
    CiviliteEnum:
      enum:
      - Madame
      - Monsieur
      type: string
      description: "* `` - \n* `Madame` - Madame\n* `Monsieur` - Monsieur"
    CodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 10
      required:
      - code
    ConnexionRequest:
      type: object
      properties:
        identifiant:
          type: string
          minLength: 1
          maxLength: 254
        mot_de_passe:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - identifiant
      - mot_de_passe
    ContactInscriptionRequest:
      type: object
      properties:
        civilite:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/CiviliteEnum'
          - $ref: '#/components/schemas/BlankEnum'
        prenom:
          type: string
          minLength: 1
          maxLength: 100
        nom:
          type: string
          minLength: 1
          maxLength: 100
        courriel:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        telephone:
          type: string
          default: ''
          maxLength: 20
      required:
      - courriel
      - nom
      - prenom
    CreneauRequest:
      type: object
      properties:
        espace:
          type: integer
          minimum: 1
        date_debut:
          type: string
          format: date
        date_fin:
          type: string
          format: date
          nullable: true
        heure_debut:
          type: string
          format: time
        heure_fin:
          type: string
          format: time
        jours:
          type: array
          items:
            $ref: '#/components/schemas/JoursEnum'
          maxItems: 7
        toutes_les_semaines:
          type: integer
          maximum: 4
          minimum: 1
          default: 1
        exclure_vacances:
          type: boolean
          default: true
      required:
      - date_debut
      - espace
      - heure_debut
      - heure_fin
    DefiRequest:
      type: object
      properties:
        defi:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 10
      required:
      - code
      - defi
    DemandeCampagneRequest:
      type: object
      properties:
        usager:
          type: integer
          minimum: 1
        objet:
          type: string
          default: ''
          maxLength: 250
      required:
      - usager
    DepotPortailRequest:
      type: object
      properties:
        type_piece:
          type: integer
        fichier:
          type: string
          format: binary
        valide_jusqu_au:
          type: string
          format: date
          nullable: true
      required:
      - fichier
      - type_piece
    EspacePublic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 150
        site:
          type: integer
          readOnly: true
        site_nom:
          type: string
          readOnly: true
        adresse:
          type: string
          readOnly: true
        famille:
          type: integer
        famille_libelle:
          type: string
          readOnly: true
        parent:
          type: integer
          nullable: true
          readOnly: true
        parent_nom:
          type: string
          nullable: true
          readOnly: true
        description:
          type: string
        capacite:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Capacité d'accueil (personnes)
        surface_m2:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Surface (m²)
        accessible_pmr:
          type: boolean
          title: Accessible aux personnes à mobilité réduite
        equipements:
          type: string
          title: Équipements fixes
        activites:
          type: string
          title: Activités possibles
          maxLength: 300
        partageable:
          type: boolean
          description: Plusieurs réservations simultanées possibles (REF-07).
        photos:
          type: string
          readOnly: true
        documents:
          type: string
          readOnly: true
      required:
      - adresse
      - documents
      - famille
      - famille_libelle
      - id
      - nom
      - parent
      - parent_nom
      - photos
      - site
      - site_nom
    FamillePublique:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        libelle:
          type: string
          maxLength: 120
      required:
      - code
      - id
      - libelle
    IdentifiantRequest:
      type: object
      properties:
        identifiant:
          type: string
          minLength: 1
          maxLength: 254
      required:
      - identifiant
    InscriptionRequest:
      type: object
      properties:
        contact:
          $ref: '#/components/schemas/ContactInscriptionRequest'
        usager:
          $ref: '#/components/schemas/UsagerInscriptionRequest'
        mot_de_passe:
          type: string
          minLength: 1
          maxLength: 256
        consentement:
          type: boolean
      required:
      - consentement
      - contact
      - mot_de_passe
      - usager
    JetonRequest:
      type: object
      properties:
        jeton:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - jeton
    JoursEnum:
      enum:
      - MO
      - TU
      - WE
      - TH
      - FR
      - SA
      - SU
      type: string
      description: |-
        * `MO` - MO
        * `TU` - TU
        * `WE` - WE
        * `TH` - TH
        * `FR` - FR
        * `SA` - SA
        * `SU` - SU
    MessageRequest:
      type: object
      properties:
        corps:
          type: string
          minLength: 1
          maxLength: 5000
      required:
      - corps
    MotifPortailRequest:
      type: object
      properties:
        motif:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - motif
    NouveauContactRequest:
      type: object
      properties:
        civilite:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/CiviliteEnum'
          - $ref: '#/components/schemas/BlankEnum'
        prenom:
          type: string
          minLength: 1
          maxLength: 100
        nom:
          type: string
          minLength: 1
          maxLength: 100
        courriel:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        telephone:
          type: string
          default: ''
          maxLength: 20
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: referent
        peut_signer:
          type: boolean
          default: false
        inviter:
          type: boolean
          default: true
      required:
      - courriel
      - nom
      - prenom
    NouveauDossierRequest:
      type: object
      properties:
        usager:
          type: integer
          minimum: 1
        type_reservation:
          type: integer
          minimum: 1
        objet:
          type: string
          default: ''
          maxLength: 250
        creneaux:
          type: array
          items:
            $ref: '#/components/schemas/CreneauRequest'
          maxItems: 10
      required:
      - usager
    PaginatedEspacePublicList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/EspacePublic'
    PatchedCompteRequest:
      type: object
      properties:
        civilite:
          oneOf:
          - $ref: '#/components/schemas/CiviliteEnum'
          - $ref: '#/components/schemas/BlankEnum'
        prenom:
          type: string
          minLength: 1
          maxLength: 100
        nom:
          type: string
          minLength: 1
          maxLength: 100
        telephone:
          type: string
          maxLength: 20
    PatchedModificationDossierRequest:
      type: object
      properties:
        etape:
          type: integer
          maximum: 4
          minimum: 1
        type_reservation:
          type: integer
          minimum: 1
        objet:
          type: string
          maxLength: 250
        activite:
          type: string
          maxLength: 150
        effectif:
          type: integer
          maximum: 100000
          minimum: 0
        observations:
          type: string
          maxLength: 2000
        creneaux:
          type: array
          items:
            $ref: '#/components/schemas/CreneauRequest'
          maxItems: 10
    PatchedPreferencesRequest:
      type: object
      properties:
        sms:
          type: boolean
          title: Recevoir aussi les SMS (rappels, fermetures)
        telephone_sms:
          type: string
          maxLength: 20
        rappels:
          type: boolean
          title: Rappel la veille des séances
        informations:
          type: boolean
          title: Informations générales de la Ville
    PatchedUsagerPortailRequest:
      type: object
      properties:
        sigle:
          type: string
          maxLength: 40
        adresse:
          type: string
          minLength: 1
          maxLength: 250
        code_postal:
          type: string
          minLength: 1
          pattern: ^\d{5}$
        commune:
          type: string
          minLength: 1
          maxLength: 80
        telephone:
          type: string
          maxLength: 20
        courriel:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
    Preferences:
      type: object
      properties:
        sms:
          type: boolean
          title: Recevoir aussi les SMS (rappels, fermetures)
        telephone_sms:
          type: string
          maxLength: 20
        rappels:
          type: boolean
          title: Rappel la veille des séances
        informations:
          type: boolean
          title: Informations générales de la Ville
    ReinitialisationRequest:
      type: object
      properties:
        jeton:
          type: string
          minLength: 1
          maxLength: 100
        mot_de_passe:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - jeton
      - mot_de_passe
    RoleContactEnum:
      enum:
      - president
      - tresorier
      - secretaire
      - referent
      - directeur
      - responsable
      - autre
      type: string
      description: |-
        * `president` - president
        * `tresorier` - tresorier
        * `secretaire` - secretaire
        * `referent` - referent
        * `directeur` - directeur
        * `responsable` - responsable
        * `autre` - autre
    RoleEnum:
      enum:
      - president
      - tresorier
      - secretaire
      - referent
      - directeur
      - responsable
      - autre
      type: string
      description: |-
        * `president` - president
        * `tresorier` - tresorier
        * `secretaire` - secretaire
        * `referent` - referent
        * `directeur` - directeur
        * `responsable` - responsable
        * `autre` - autre
    ScanPortailRequest:
      type: object
      properties:
        fichier:
          type: string
          format: binary
      required:
      - fichier
    SitePublic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 150
        adresse:
          type: string
          maxLength: 250
        code_postal:
          type: string
          maxLength: 5
        commune:
          type: string
          maxLength: 80
      required:
      - id
      - nom
    TypeEnum:
      enum:
      - association
      - ecole
      - entreprise
      - particulier
      - autre_collectivite
      type: string
      description: |-
        * `association` - Association
        * `ecole` - École ou établissement scolaire
        * `entreprise` - Entreprise ou comité social et économique
        * `particulier` - Particulier
        * `autre_collectivite` - Autre collectivité ou organisme public
    UsagerInscriptionRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        nom:
          type: string
          default: ''
          maxLength: 200
        sigle:
          type: string
          default: ''
          maxLength: 40
        siret:
          oneOf:
          - type: string
            default: ''
            pattern: ^(\d{14})?$
          - type: string
            maxLength: 0
        rna:
          oneOf:
          - type: string
            default: ''
            pattern: ^(W\d{9})?$
          - type: string
            maxLength: 0
        adresse:
          type: string
          minLength: 1
          maxLength: 250
        code_postal:
          type: string
          minLength: 1
          pattern: ^\d{5}$
        commune:
          type: string
          minLength: 1
          maxLength: 80
        telephone:
          type: string
          default: ''
          maxLength: 20
        role_contact:
          allOf:
          - $ref: '#/components/schemas/RoleContactEnum'
          default: responsable
      required:
      - adresse
      - code_postal
      - commune
      - type
