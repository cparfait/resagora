paths:
  /api/mobile/auth/connexion:
    post:
      operationId: mobile_auth_connexion_create
      description: |-
        Compte de l'annuaire et rôle « gardien » ; second facteur exigé en option B ou si l'agent l'a activé. Tout refus
        antérieur au code TOTP reçoit la même réponse (pas d'oracle sur le mot de passe) ; en option B, le certificat
        d'appareil est vérifié avant l'annuaire et seul le compte de cet appareil peut s'y connecter.
      tags:
      - mobile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionMobileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnexionMobileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnexionMobileRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/mobile/auth/deconnexion:
    post:
      operationId: mobile_auth_deconnexion_create
      tags:
      - mobile
      responses:
        '204':
          description: No response body
  /api/mobile/auth/totp:
    post:
      operationId: mobile_auth_totp_create
      tags:
      - mobile
      requestBody:
        content:
          application/json:
