components:
  schemas:
    Absence:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        agent:
          type: integer
        agent_nom:
          type: string
          readOnly: true
        debut:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        nature:
          $ref: '#/components/schemas/AbsenceNatureEnum'
        commentaire:
          type: string
          maxLength: 250
        cree_le:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent
      - agent_nom
      - cree_le
      - debut
      - fin
      - id
      - nature
    AbsenceNatureEnum:
      enum:
      - conge
      - maladie
      - formation
      - autre
      type: string
      description: |-
        * `conge` - Congé
        * `maladie` - Arrêt maladie
        * `formation` - Formation
        * `autre` - Autre absence
    AbsenceRequest:
      type: object
      properties:
        agent:
          type: integer
        debut:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        nature:
          $ref: '#/components/schemas/AbsenceNatureEnum'
        commentaire:
          type: string
          maxLength: 250
      required:
      - agent
      - debut
      - fin
      - nature
    AffectationRequest:
      type: object
      properties:
        agent:
          type: integer
          nullable: true
        forcer:
          type: boolean
          default: false
        motif:
          type: string
          default: ''
          maxLength: 300
      required:
      - agent
    Agent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        utilisateur:
          type: integer
          readOnly: true
          nullable: true
        matricule:
          type: string
          maxLength: 20
        identifiant_ad:
          type: string
          title: Identifiant de l'annuaire
          description: Rattache la fiche au compte de l'annuaire à la première connexion
            (sAMAccountName).
          maxLength: 150
        prenom:
          type: string
          maxLength: 100
        nom:
          type: string
          maxLength: 100
        courriel:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        telephone:
          type: string
          maxLength: 20
        sites:
          type: array
          items:
            type: integer
          description: Sites où l'agent peut être affecté.
        sites_noms:
          type: array
          items:
            type: string
          readOnly: true
        site_prefere:
          type: integer
          nullable: true
        duree_hebdo_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Durée hebdomadaire de référence (minutes)
        actif:
          type: boolean
        habilitations:
          type: array
          items:
            $ref: '#/components/schemas/HabilitationAgent'
          readOnly: true
      required:
      - habilitations
      - id
      - matricule
      - nom
      - prenom
      - sites
      - sites_noms
      - utilisateur
    AgentRequest:
      type: object
      properties:
        matricule:
          type: string
          minLength: 1
          maxLength: 20
        identifiant_ad:
          type: string
          title: Identifiant de l'annuaire
          description: Rattache la fiche au compte de l'annuaire à la première connexion
            (sAMAccountName).
          maxLength: 150
        prenom:
          type: string
          minLength: 1
          maxLength: 100
        nom:
          type: string
          minLength: 1
          maxLength: 100
        courriel:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        telephone:
          type: string
          maxLength: 20
        sites:
          type: array
          items:
            type: integer
          description: Sites où l'agent peut être affecté.
        site_prefere:
          type: integer
          nullable: true
        duree_hebdo_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Durée hebdomadaire de référence (minutes)
        actif:
          type: boolean
      required:
      - matricule
      - nom
      - prenom
      - sites
    Alternative:
      type: object
      properties:
        espace:
          type: integer
        espace_nom:
          type: string
        debut:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        raison:
          type: string
      required:
      - debut
      - espace
      - espace_nom
      - fin
      - raison
    AnnulationRequest:
      type: object
      properties:
        motif:
          type: string
          minLength: 1
          maxLength: 300
        par_usager:
          type: boolean
          default: false
          description: Annulation demandée par l'usager (tardive dans le délai paramétré,
            RG-08).
      required:
      - motif
    Apercu:
      type: object
      properties:
        seances:
          type: array
          items:
            type: object
            additionalProperties: {}
        conflits:
          type: array
          items:
            $ref: '#/components/schemas/Conflit'
        hors_horaires:
          type: array
          items:
            type: string
            format: date-time
        fermetures:
          type: array
          items:
            type: string
            format: date-time
        description:
          type: string
      required:
      - conflits
      - description
      - fermetures
      - hors_horaires
      - seances
    Appareil:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        agent:
          type: integer
        agent_nom:
          type: string
          readOnly: true
        libelle:
          type: string
          maxLength: 120
        empreinte_certificat:
          type: string
          readOnly: true
          description: SHA-256 du certificat d'appareil (option B, accès par la DMZ).
        actif:
          type: boolean
          readOnly: true
        a_autoriser:
          type: boolean
          readOnly: true
          description: 'Nouvel appareil d''un agent dont un appareil a été retiré
            : à autoriser par le planificateur.'
        enregistre_le:
          type: string
          format: date-time
          readOnly: true
        revoque_le:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        derniere_synchronisation:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - a_autoriser
      - actif
      - agent
      - agent_nom
      - derniere_synchronisation
      - empreinte_certificat
      - enregistre_le
      - id
      - libelle
      - revoque_le
    AppareilRequest:
      type: object
      properties:
        agent:
          type: integer
        libelle:
