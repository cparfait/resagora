components:
  schemas:
    Batiment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        site:
          type: integer
        site_nom:
          type: string
          readOnly: true
        nom:
          type: string
          maxLength: 150
        erp_categorie:
          type: string
          title: Catégorie ERP
          maxLength: 3
        erp_type:
          type: string
          title: Type ERP
          maxLength: 3
        actif:
          type: boolean
      required:
      - id
      - nom
      - site
      - site_nom
    BatimentRequest:
      type: object
      properties:
        site:
          type: integer
        nom:
          type: string
          minLength: 1
          maxLength: 150
        erp_categorie:
          type: string
          title: Catégorie ERP
          maxLength: 3
        erp_type:
          type: string
          title: Type ERP
          maxLength: 3
        actif:
          type: boolean
      required:
      - nom
      - site
    CodeTotpRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: ^\s*\d{3}\s?\d{3}\s*$
      required:
      - code
    ConnexionRequest:
      type: object
      properties:
        identifiant:
          type: string
          minLength: 1
          maxLength: 128
        mot_de_passe:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - identifiant
      - mot_de_passe
    Enrolement:
      type: object
      properties:
        uri:
          type: string
        qr_svg:
          type: string
        graine:
          type: string
      required:
      - graine
      - qr_svg
      - uri
    Espace:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        nom:
          type: string
          maxLength: 150
        batiment:
          type: integer
        batiment_nom:
          type: string
          readOnly: true
        site:
          type: integer
          readOnly: true
        site_nom:
          type: string
          readOnly: true
        parent:
          type: integer
          nullable: true
          description: 'Espace englobant : réserver l''un bloque l''autre (REF-05).'
        famille:
          type: integer
        famille_libelle:
          type: string
          readOnly: true
        description:
          type: string
        capacite:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Capacité d'accueil (personnes)
        surface_m2:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Surface (m²)
        accessible_pmr:
          type: boolean
          title: Accessible aux personnes à mobilité réduite
        equipements:
          type: string
          title: Équipements fixes
        activites:
          type: string
          title: Activités possibles
          maxLength: 300
        gardiennage_requis:
          type: boolean
          description: Toute occupation génère un besoin de gardien (REF-04).
        temps_ouverture_min:
          type: integer
          maximum: 32767
          minimum: 0
          title: Temps d'ouverture (min)
        temps_fermeture_min:
          type: integer
          maximum: 32767
          minimum: 0
          title: Temps de fermeture (min)
        partageable:
          type: boolean
