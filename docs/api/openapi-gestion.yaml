  /api/gestion/finances/paiements-en-ligne:
    get:
      operationId: gestion_finances_paiements_en_ligne_list
      description: |-
        Lecture seule : une tentative ne naît que du portail et ne change que par le résultat lu chez PayFiP, ou par la
        clôture motivée d'un agent après contrôle.
      parameters:
      - in: query
        name: controle
        schema:
          type: string
          enum:
          - ''
          - doublon_probable
          - incoherent
          - resultat_inconnu
          - saisie_test
          - trop_percu
        description: |-
          * `` - —
          * `trop_percu` - Trop-perçu à rembourser
          * `doublon_probable` - Déjà encaissé par ailleurs ? À vérifier
          * `incoherent` - Résultat PayFiP incohérent
          * `resultat_inconnu` - Résultat PayFiP inconnu
          * `saisie_test` - Paiement de test hors recette
      - in: query
        name: controle__in
        schema:
          type: array
          items:
            type: string
        description: Les valeurs multiples doivent être séparées par des virgules.
        explode: false
        style: form
      - in: query
        name: cree_le__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: cree_le__lt
        schema:
          type: string
          format: date-time
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: piece
        schema:
          type: integer
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - a_controler
          - abandonnee
          - creee
          - erreur
          - expiree
          - payee
          - redirigee
          - refusee
          - remplacee
        description: |-
          * `creee` - En préparation
          * `redirigee` - En cours sur PayFiP
          * `remplacee` - Remplacée par une autre tentative (encore relue)
          * `payee` - Payée
          * `refusee` - Refusée par la banque
          * `abandonnee` - Abandonnée par l'usager
          * `expiree` - Sans résultat de PayFiP (encore relue 7 jours)
          * `a_controler` - À contrôler par le service financier
          * `erreur` - Close sans paiement
      - in: query
        name: statut__in
        schema:
          type: array
          items:
            type: string
        description: Les valeurs multiples doivent être séparées par des virgules.
        explode: false
        style: form
      - name: taille
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - gestion
      security:
      - sessionAgent: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTentativeList'
          description: ''
    post:
      operationId: gestion_finances_paiements_en_ligne_create
      description: |-
        Lecture seule : une tentative ne naît que du portail et ne change que par le résultat lu chez PayFiP, ou par la
        clôture motivée d'un agent après contrôle.
      tags:
      - gestion
      security:
