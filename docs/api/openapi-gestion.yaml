components:
  schemas:
    Alternative:
      type: object
      properties:
        espace:
          type: integer
        espace_nom:
          type: string
        debut:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        raison:
          type: string
      required:
      - debut
      - espace
      - espace_nom
      - fin
      - raison
    Apercu:
      type: object
      properties:
        seances:
          type: array
          items:
            type: object
            additionalProperties: {}
        conflits:
          type: array
          items:
            $ref: '#/components/schemas/Conflit'
        hors_horaires:
          type: array
          items:
            type: string
            format: date-time
        fermetures:
          type: array
          items:
            type: string
            format: date-time
        description:
          type: string
      required:
      - conflits
      - description
      - fermetures
      - hors_horaires
      - seances
    AttributionRequest:
      type: object
      properties:
        decisions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DecisionRequest'
      required:
      - decisions
    Batiment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        site:
          type: integer
        site_nom:
          type: string
          readOnly: true
        nom:
          type: string
          maxLength: 150
        erp_categorie:
          type: string
          title: Catégorie ERP
          maxLength: 3
        erp_type:
          type: string
          title: Type ERP
          maxLength: 3
        actif:
          type: boolean
      required:
      - id
      - nom
      - site
      - site_nom
    BatimentRequest:
      type: object
      properties:
        site:
          type: integer
        nom:
          type: string
          minLength: 1
          maxLength: 150
        erp_categorie:
          type: string
          title: Catégorie ERP
          maxLength: 3
        erp_type:
          type: string
          title: Type ERP
          maxLength: 3
        actif:
          type: boolean
      required:
      - nom
      - site
    Campagne:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        saison:
          type: integer
        saison_nom:
          type: string
          readOnly: true
        nom:
          type: string
          maxLength: 150
        ouverture:
          type: string
          format: date
        cloture:
          type: string
          format: date
        date_commission:
          type: string
          format: date
          nullable: true
        statut:
          allOf:
          - $ref: '#/components/schemas/StatutCampagneEnum'
          readOnly: true
        sites:
          type: array
          items:
            type: integer
          description: 'Vide : tous les sites.'
        nombre_demandes:
          type: integer
          readOnly: true
      required:
      - cloture
      - id
      - nom
      - nombre_demandes
      - ouverture
      - saison
      - saison_nom
      - statut
    CampagneRequest:
      type: object
      properties:
        saison:
          type: integer
        nom:
          type: string
          minLength: 1
          maxLength: 150
        ouverture:
          type: string
          format: date
        cloture:
          type: string
          format: date
        date_commission:
          type: string
          format: date
          nullable: true
        sites:
          type: array
          items:
            type: integer
          description: 'Vide : tous les sites.'
      required:
      - cloture
      - nom
      - ouverture
      - saison
    CodeTotpRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: ^\s*\d{3}\s?\d{3}\s*$
      required:
      - code
    ColorationEnum:
      enum:
      - statut
      - type_usager
      type: string
      description: |-
        * `statut` - Par statut
        * `type_usager` - Par type d'usager
    Conflit:
      type: object
      properties:
        occurrence:
          type: integer
        reservation:
          type: integer
        dossier:
          type: string
        usager:
          type: string
        espace:
          type: string
        debut:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
      required:
      - debut
      - dossier
      - espace
