      - gestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilisateurRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UtilisateurRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UtilisateurRequest'
      security:
      - sessionAgent: []
      responses:
        '201':
