        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/gestion/admin/agents:
    get:
      operationId: gestion_admin_agents_list
      description: '`chemin_site` : chemin ORM vers le site de l''objet (None = objet
        transversal).'
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: source
        schema:
          type: string
          enum:
          - ad
          - local
        description: |-
          * `ad` - Active Directory
          * `local` - Compte technique local
      - name: taille
