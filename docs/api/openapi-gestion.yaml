            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/gestion/admin/agents:
    get:
      operationId: gestion_admin_agents_list
      description: '`chemin_site` : chemin ORM vers le site de l''objet (None = objet
        transversal).'
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: source
        schema:
          type: string
          enum:
          - ad
          - local
        description: |-
          * `ad` - Active Directory
          * `local` - Compte technique local
      - name: taille
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - gestion
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUtilisateurList'
          description: ''
    post:
      operationId: gestion_admin_agents_create
      description: 'Les agents naissent à leur première connexion par l''annuaire
        : pas de création manuelle.'
      tags:
      - gestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilisateurRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UtilisateurRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UtilisateurRequest'
