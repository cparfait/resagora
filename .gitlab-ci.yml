# Intégration continue (D-009) : toutes les étapes appellent le Makefile.
# Images de base épinglées par digest ; aucun secret réel en CI (secrets de test générés).

stages: [qualite, tests, images, securite, e2e]

variables:
  PYTHONIOENCODING: utf-8
  POSTGRES_DB: equipements
  POSTGRES_USER: equipements
  POSTGRES_PASSWORD: dev-uniquement
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  VERSION: $CI_COMMIT_SHORT_SHA

.outils: &outils
  image: ${CI_REGISTRY_IMAGE}/outils:latest-ci
  before_script:
    - (cd backend && UV_PROJECT_ENVIRONMENT=.venv uv sync --frozen)
    - (cd facade && UV_PROJECT_ENVIRONMENT=.venv uv sync --frozen)
    - npm ci --no-audit --no-fund
    - npm ci --prefix outils/codegen --no-audit --no-fund

outils:
  stage: .pre
  image: docker:29.8.2-cli
  services: [docker:29.8.2-dind]
  script:
    - docker build -f deploy/dev/outils.Dockerfile -t ${CI_REGISTRY_IMAGE}/outils:latest-ci .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push ${CI_REGISTRY_IMAGE}/outils:latest-ci
  rules: [{ changes: [deploy/dev/outils.Dockerfile] }]

motifs-interdits:
  <<: *outils
  stage: qualite
  before_script: []
  script: [make motifs]

lint:
  <<: *outils
  stage: qualite
  script: [make lint]

tests:
  <<: *outils
  stage: tests
  services:
    - name: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
      alias: postgres
  script:
    - make test
    - make migrations-reversibles
    - make matrice
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports: { coverage_report: { coverage_format: cobertura, path: backend/coverage.xml } }
    paths: [docs/recette/matrice.csv]

images:
  stage: images
  image: docker:29.8.2-cli
  services: [docker:29.8.2-dind]
  script:
    - for app in api facade; do docker build -f deploy/images/$app.Dockerfile -t equipements/$app:$VERSION .; done
    - for app in backoffice portail mobile; do docker build -f deploy/images/front.Dockerfile --build-arg APPLICATION=$app -t equipements/$app:$VERSION .; done

trivy:
  stage: securite
  image: docker:29.8.2-cli
  services: [docker:29.8.2-dind]
  script:
    - apk add --no-cache python3
    - python3 scripts/analyse_trivy.py --sbom --version $VERSION
  artifacts:
    paths: [docs/securite/]
    when: always

e2e:
  stage: e2e
  image: docker:29.8.2-cli
  services: [docker:29.8.2-dind]
  script:
    - apk add --no-cache make python3 py3-cryptography nodejs npm bash
    - make certs secrets up up-dmz demo
    - make e2e a11y
  artifacts:
    paths: [e2e/playwright-report/]
    when: always
