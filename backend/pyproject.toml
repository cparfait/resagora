[project]
name = "equipements-chatillon-api"
version = "1.0.0"
description = "API métier de la plateforme de gestion des équipements sportifs et associatifs — Ville de Châtillon"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django==6.1.2",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "django-filter==26.2",
    "celery==5.6.3",
    "redis==8.1.0",
    "psycopg[binary]==3.3.6",
    "gunicorn==26.2.0",
    "python-ldap==3.4.8; sys_platform != 'win32'",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "segno==1.6.6",
    "cryptography==50.0.2",
    "python-dateutil==3.0.0",
    "icalendar==7.3.0",
    "docxtpl==0.20.2",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "lxml==6.1.3",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "faker==40.44.0",
    "freezegun==1.5.5",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "django-stubs==6.1.2",
    "djangorestframework-stubs==3.18.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py314"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "RUF", "SIM", "PL"]
ignore = ["S101", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003", "RUF012", "PLR0911", "PLR0912", "PLC0415", "UP046", "UP047", "SIM102", "E501", "DJ012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "PLR0915", "S108"]
"config/settings/*.py" = ["F405", "F403", "S105"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers --reuse-db -m \"not integration\""
markers = ["integration: nécessite les conteneurs de développement (annuaire, Mailpit, Gotenberg, ClamAV, DocuSeal)"]
filterwarnings = ["ignore::DeprecationWarning:docxcompose.*"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = false
skip_covered = true
