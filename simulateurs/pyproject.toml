[project]
name = "simulateurs-recette"
version = "1.0.0"
description = "Simulateurs fidèles des services tiers (SMS, DocuSeal, PayFiP) pour la recette ; jamais en production"
requires-python = ">=3.14,<3.15"
dependencies = [
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "tzdata==2026.6",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PL"]
ignore = ["S101", "PLR2004", "PLR0913", "RUF001", "RUF002", "RUF003", "PLC0415", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`:DeprecationWarning"]
